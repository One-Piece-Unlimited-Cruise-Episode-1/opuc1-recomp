name: Package installers

# Builds the per-platform installer/setup tool (opuc1-recomp-setup.exe /
# opuc1-recomp-setup-<arch>.AppImage / opuc1-recomp-setup.pkg + opuc1-recomp-setup-macos.run) via the
# platform packaging scripts in launcher/ - the same scripts a maintainer runs by hand to produce a
# GitHub Release asset. This does NOT build the translated game executable: that step needs the
# player's own One Piece Unlimited Cruise Episode 1 disc (PAL ROUPAF, its main.dol and DATA tree),
# which is proprietary and not present in this repository or in CI.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Translates entirely synthetic PowerPC code and compiles/links the real Windows runtime with the
  # shipped toolchain, so a release never goes out with a runtime that no longer builds.
  recompilation:
    name: Recompilation test (synthetic DOL)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Cache downloads only. Preparation still validates pins, and every run
      # compiles current aurora, runtime, and generated sources from scratch.
      - uses: actions/cache@v5
        with:
          path: launcher/artifacts/downloads
          key: windows-recomp-downloads-${{ hashFiles('launcher/Prepare-PortableTools.ps1', 'launcher/Prepare-Dependencies.ps1') }}

      - name: Run sccache-action
        uses: mozilla/sccache-action@v0.0.11

      # Tell CMake to use sccache and use GitHub's API.
      - name: Configure sccache environment
        shell: pwsh
        run: |
          "SCCACHE_GHA_ENABLED=true" | Add-Content -Path $env:GITHUB_ENV
          "ACTIONS_CACHE_SERVICE_V2=on" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE_PATH" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE_PATH" | Add-Content -Path $env:GITHUB_ENV

      - name: Prepare the shipped Windows toolchain
        shell: pwsh
        run: ./launcher/Prepare-PortableTools.ps1

      - name: Build and run Windows host-platform tests
        shell: pwsh
        run: |
          $tools = Join-Path $PWD 'launcher/artifacts/portable-tools'
          $env:PATH = "$tools/llvm-mingw/bin;$tools/CMake/bin;$tools/Ninja;$env:PATH"
          cmake -S runtime -B build-platform -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DMKW_BUILD_PRODUCTS=OFF -DMKW_PLATFORM_TESTS_ONLY=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-platform --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-platform --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned native dependencies
        shell: pwsh
        run: ./launcher/Prepare-Dependencies.ps1

      - name: Translate, compile the full runtime, and link
        shell: pwsh
        run: ./launcher/Test-Recompilation.ps1 -Parallel 4

      - name: Test GX performance paths
        shell: pwsh
        run: |
          $tools = Join-Path $PWD 'launcher/artifacts/portable-tools'
          $build = Join-Path $PWD 'build/recomp-test/native-build'
          $env:PATH = "$build;$tools/llvm-mingw/bin;$tools/CMake/bin;$tools/Ninja;$env:PATH"
          cmake -S build/recomp-test/runtime -B $build -DMKW_BUILD_AURORA_TESTS=ON -DFETCHCONTENT_FULLY_DISCONNECTED=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --parallel 3 --target gx_fifo_tests shader_module_cache_tests mkw_gx_texture_binding_tests mkw_gx_sync_tests mkw_gx_dl_cache_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build --output-on-failure --no-tests=error -R '^(GXFifoTest|RuntimeDirectDrawTest|ShaderModuleCacheTest|mkw_gx_(texture_binding|sync|dl_cache)_tests)'

      # Print cache results (even if the build fails)
      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

  linux-appimage:
    name: Linux (AppImage, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A dispatched run's Package version becomes the one product version for this job, so the
      # setup host (--version), the installer manifest and the macOS bundle all report it.
      - name: Apply the requested package version
        if: inputs.version != ''
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Package version must be one to three period-separated integers: $PACKAGE_VERSION"; exit 1; }
          props=launcher/Directory.Build.props
          sed -E "s#<Version>[^<]*</Version>#<Version>$version</Version>#" "$props" > "$props.tmp"
          mv "$props.tmp" "$props"
          grep -Fq "<Version>$version</Version>" "$props"
          echo "Package version: $version"

      # appimagetool ships as an AppImage itself and needs to self-mount via FUSE to run directly;
      # GitHub's Ubuntu runners don't have libfuse2 preinstalled. The rest is what the precompiled
      # aurora/SDL3 package (Prepare-NativePrebuilt.sh) needs to build.
      - name: Install dependencies (required by appimagetool and SDL3 build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Build AppImage
        run: bash launcher/build-appimage.sh

      - name: Verify the AppImage reports the package version
        run: |
          set -euo pipefail
          expected=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' launcher/Directory.Build.props | head -n 1)
          actual=$(launcher/dist/opuc1-recomp-setup-${{ matrix.arch }}.AppImage --version)
          echo "AppImage version: $actual (expected $expected)"
          test "$actual" = "$expected"

      - uses: actions/upload-artifact@v7
        with:
          name: opuc1-recomp-setup-linux-${{ matrix.arch }}
          path: launcher/dist/opuc1-recomp-setup-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          archive: false

  windows-installer:
    name: Windows (installer exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A dispatched run's Package version becomes the one product version for this job, so the
      # setup host (--version), the installer manifest and the macOS bundle all report it.
      - name: Apply the requested package version
        if: inputs.version != ''
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Package version must be one to three period-separated integers: $PACKAGE_VERSION"; exit 1; }
          props=launcher/Directory.Build.props
          sed -E "s#<Version>[^<]*</Version>#<Version>$version</Version>#" "$props" > "$props.tmp"
          mv "$props.tmp" "$props"
          grep -Fq "<Version>$version</Version>" "$props"
          echo "Package version: $version"

      - name: Build installer
        shell: pwsh
        run: ./launcher/Build-Installer.ps1

      - name: Verify the setup host reports the package version
        shell: pwsh
        run: |
          $expected = ([xml](Get-Content launcher/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $actual = ((& launcher/artifacts/installer-build/publish/setup/opuc1-recomp-setup.exe --version) -join '').Trim()
          Write-Host "Setup host version: $actual (expected $expected)"
          if ($actual -ne $expected) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: opuc1-recomp-setup-windows-x64
          path: launcher/dist/opuc1-recomp-setup.exe
          if-no-files-found: error
          archive: false

  macos-setup-package:
    name: macOS (universal Setup.pkg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A dispatched run's Package version becomes the one product version for this job, so the
      # setup host (--version), the installer manifest and the macOS bundle all report it.
      - name: Apply the requested package version
        if: inputs.version != ''
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Package version must be one to three period-separated integers: $PACKAGE_VERSION"; exit 1; }
          props=launcher/Directory.Build.props
          sed -E "s#<Version>[^<]*</Version>#<Version>$version</Version>#" "$props" > "$props.tmp"
          mv "$props.tmp" "$props"
          grep -Fq "<Version>$version</Version>" "$props"
          echo "Package version: $version"

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p

      - name: Download pinned Nod tools
        shell: bash
        run: |
          mkdir -p launcher/artifacts/macos
          nodtool_version=v2.0.0-alpha.10
          nodtool_arm64_asset=nodtool-macos-arm64
          nodtool_arm64_sha256=e23ca466999b720c55e6d29c9683fce8cc74451ba64ead2e543d50129f24528a
          nodtool_x86_64_asset=nodtool-macos-x86_64
          nodtool_x86_64_sha256=f68f504dc2b72694b468ca78b6a24142c7aa5c8800f77564297f4143682e6575
          curl -fsSL --retry 3 \
            "https://github.com/encounter/nod/releases/download/${nodtool_version}/${nodtool_arm64_asset}" \
            -o launcher/artifacts/macos/nodtool-arm64
          curl -fsSL --retry 3 \
            "https://github.com/encounter/nod/releases/download/${nodtool_version}/${nodtool_x86_64_asset}" \
            -o launcher/artifacts/macos/nodtool-x86_64
          printf '%s  %s\n' "$nodtool_arm64_sha256" launcher/artifacts/macos/nodtool-arm64 | shasum -a 256 -c -
          printf '%s  %s\n' "$nodtool_x86_64_sha256" launcher/artifacts/macos/nodtool-x86_64 | shasum -a 256 -c -
          chmod +x launcher/artifacts/macos/nodtool-arm64 launcher/artifacts/macos/nodtool-x86_64

      - name: Publish self-contained Translator tools
        shell: bash
        run: |
          dotnet publish translator/src/Translator.Cli/Translator.Cli.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -o launcher/artifacts/macos/translator-arm64
          dotnet publish translator/src/Translator.Cli/Translator.Cli.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o launcher/artifacts/macos/translator-x86_64

      - name: Publish self-contained setup CLI
        shell: bash
        run: |
          dotnet publish launcher/Opuc1Recomp.Setup.Linux/Opuc1Recomp.Setup.Linux.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -o launcher/artifacts/macos/setup-arm64
          dotnet publish launcher/Opuc1Recomp.Setup.Linux/Opuc1Recomp.Setup.Linux.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o launcher/artifacts/macos/setup-x86_64

      - name: Download pinned universal Ninja
        shell: bash
        run: |
          ninja_version=1.13.2
          ninja_sha256=c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b
          curl -fsSL --retry 3 "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-mac.zip" -o ninja-mac.zip
          printf '%s  %s\n' "$ninja_sha256" ninja-mac.zip | shasum -a 256 -c -
          unzip -q ninja-mac.zip -d launcher/artifacts/macos/ninja
          chmod +x launcher/artifacts/macos/ninja/ninja

      - name: Download pinned portable CMake
        shell: bash
        run: |
          cmake_version=4.4.3
          archive="cmake-${cmake_version}-macos-universal.tar.gz"
          base_url="https://github.com/Kitware/CMake/releases/download/v${cmake_version}"
          expected_sha256=0c5d65251c14cc884bfa16bdbed3c263ce5bffe2e21c0d0d00962cb0610464fa
          curl -fsSL --retry 3 "$base_url/$archive" -o "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 -c -
          tar -xzf "$archive"
          mv "cmake-${cmake_version}-macos-universal/CMake.app/Contents" launcher/artifacts/macos/cmake

      - name: Build Setup.pkg
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          package_version="$PACKAGE_VERSION"
          if [[ -z "$package_version" ]]; then
            if [[ "${TAG_VERSION:-}" =~ ^v?[0-9] ]]; then
              package_version="${TAG_VERSION#v}"
            elif [[ -f "launcher/Directory.Build.props" ]]; then
              package_version=$(grep -m1 '<Version>' launcher/Directory.Build.props | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/')
            fi
          fi
          mkdir -p launcher/dist
          launcher/macos/build-setup-pkg.command \
            --nodtool-arm64 launcher/artifacts/macos/nodtool-arm64 \
            --nodtool-x86_64 launcher/artifacts/macos/nodtool-x86_64 \
            --translator-arm64 launcher/artifacts/macos/translator-arm64/Translator.Cli \
            --translator-x86_64 launcher/artifacts/macos/translator-x86_64/Translator.Cli \
            --setup-arm64 launcher/artifacts/macos/setup-arm64/opuc1-recomp-setup \
            --setup-x86_64 launcher/artifacts/macos/setup-x86_64/opuc1-recomp-setup \
            --cmake-root launcher/artifacts/macos/cmake \
            --ninja-arm64 launcher/artifacts/macos/ninja/ninja \
            --ninja-x86_64 launcher/artifacts/macos/ninja/ninja \
            --output launcher/dist/opuc1-recomp-setup.pkg \
            --run-output launcher/dist/opuc1-recomp-setup-macos.run \
            ${package_version:+--version "$package_version"}

      # The pkg must carry no translated game, no extracted disc and no generated output (the same
      # boundary Test-PayloadBoundary.ps1 enforces for the Windows payload).
      - name: Verify package layout and architecture-specific tools
        shell: bash
        run: |
          pkgutil --check-signature launcher/dist/opuc1-recomp-setup.pkg || true
          if pkgutil --payload-files launcher/dist/opuc1-recomp-setup.pkg | \
            grep -E '/(Assets|GameAssets|DATA|generated|native-build)(/|$)|/(main\.dol|opuc1-recomp)$|/Resources/workspace/.*\.(dol|rel|iso|gcm|gcz|ciso|wbfs|wia|rvz|nkit|wad|aar|thp|tpl|brsar|brstm|dsy)$'; then
            echo "::error::opuc1-recomp-setup.pkg contains a forbidden payload"
            exit 1
          fi
          expanded="$RUNNER_TEMP/opuc1-recomp-setup-expanded"
          pkgutil --expand-full launcher/dist/opuc1-recomp-setup.pkg "$expanded"
          resources="$expanded/Payload/Applications/One Piece Unlimited Recompilation Episode 1 Setup.app/Contents/Resources"
          for arch in arm64 x86_64; do
            for tool in nodtool Translator.Cli ninja; do
              lipo "$resources/tools/$arch/$tool" -verify_arch "$arch"
            done
          done
          lipo "$resources/tools/cmake/bin/cmake" -verify_arch arm64 x86_64
          bash "$resources/setup.command" --help
          /usr/bin/arch -x86_64 /bin/bash "$resources/setup.command" --help
          # The .run must answer --version without unpacking, then unpack once and run its entry point
          # with each architecture's setup CLI.
          run=launcher/dist/opuc1-recomp-setup-macos.run
          version=$("$run" --version)
          expected=$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' launcher/Directory.Build.props | head -n 1)
          echo ".run version: $version (expected $expected)"
          test "$version" = "$expected"
          for arch in arm64 x86_64; do
            setup_version=$(/usr/bin/arch -"$arch" "$resources/tools/$arch/opuc1-recomp-setup" --version)
            echo "$arch setup CLI version: $setup_version"
            test "$setup_version" = "$expected"
          done
          HOME="$RUNNER_TEMP/run-home" "$run" check-products
          unpacked="$RUNNER_TEMP/run-home/Library/Application Support/One Piece Unlimited Recompilation Episode 1/Setup/$version"
          for arch in arm64 x86_64; do
            lipo "$unpacked/tools/$arch/opuc1-recomp-setup" -verify_arch "$arch"
          done
          HOME="$RUNNER_TEMP/run-home" /usr/bin/arch -x86_64 /bin/bash "$run" check-products

      - uses: actions/upload-artifact@v7
        with:
          name: opuc1-recomp-setup-macos-universal
          path: launcher/dist/opuc1-recomp-setup.pkg
          if-no-files-found: error
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: opuc1-recomp-setup-macos-run
          path: launcher/dist/opuc1-recomp-setup-macos.run
          if-no-files-found: error
          archive: false

  # Publishes the packaged installers as a GitHub Release whenever a v* tag is pushed: a full
  # (non-prerelease) release whose tag is v<semver>, carrying every platform asset, produced by
  # setup hosts that report that same version.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-installer, macos-setup-package, recompilation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every setup host reports the version pinned in launcher/Directory.Build.props (--version), so
      # a tag pushed without bumping that pin would publish installers that report the previous
      # version. Catch that before anything is published.
      - name: Verify the tag matches the pinned setup version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=0
          check() {
            if ! grep -Fq "$2" "$1"; then
              echo "::error file=$1::expected '$2' for tag $TAG"
              status=1
            fi
          }
          check launcher/Directory.Build.props "<Version>$version</Version>"
          exit $status

      # The build jobs upload with `archive: false`, which stores each installer as a raw file
      # rather than a zip (and names the artifact after the file). Only download-artifact v8 and
      # later understand such direct uploads; v7 tries to unzip everything and fails on them.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lR artifacts
          assets=()
          for name in opuc1-recomp-setup.exe opuc1-recomp-setup-x86_64.AppImage opuc1-recomp-setup-aarch64.AppImage opuc1-recomp-setup.pkg opuc1-recomp-setup-macos.run; do
            found="$(find artifacts -type f -name "$name" | head -n 1)"
            [ -n "$found" ] && [ -s "$found" ] || { echo "::error::missing release asset $name"; exit 1; }
            assets+=("$found")
          done
          # A re-run of a tag whose release already exists only refreshes the assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes
          fi
